<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı İndirim Hesapla</title>
    <style>
        :root {
            --bg-color: #f4f8fa;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --accent-orange: #ff6b52;
            --accent-orange-hover: #f0543b;
            --accent-green: #00d2b4;
            --result-bg: #e6f9f6;
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            border: none;
            outline: none;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .input-wrapper .unit {
            padding: 12px 16px;
            background-color: #f8fafc;
            color: var(--text-sub);
            font-weight: 700;
            border-left: 1px solid var(--border-color);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-green);
            cursor: pointer;
        }

        .quick-percents {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-top: 6px;
            padding: 0 4px;
        }

        .calculate-btn {
            width: 100%;
            background-color: var(--accent-orange);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 107, 82, 0.3);
            transition: all 0.2s ease;
            margin-bottom: 24px;
        }

        .calculate-btn:active {
            transform: scale(0.98);
        }

        .result-box {
            background-color: var(--result-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid #bceee6;
        }

        .result-box .title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .result-box .final-price {
            font-size: 2.2rem;
            font-weight: 900;
            color: #056355;
            margin-bottom: 8px;
        }

        .result-box .savings {
            font-size: 0.9rem;
            font-weight: 700;
            color: #0d9488;
        }

        .history-section {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .history-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            background-color: #f8fafc;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span style="font-size: 1.4rem;">🧮</span>
        <h1>AKILLI İNDİRİM HESAPLA</h1>
        <span style="font-size: 1.2rem;">🏷️</span>
    </div>

    <div class="input-group">
        <label>Etiket Fiyatı (TL)</label>
        <div class="input-wrapper">
            <input type="number" id="price" value="249.90" step="0.01" oninput="calculate()">
            <div class="unit">₺</div>
        </div>
        <input type="range" id="price-slider" min="0" max="2000" value="250" step="10" oninput="syncPrice(this.value)">
    </div>

    <div class="input-group">
        <label>İndirim Oranı (%)</label>
        <div class="input-wrapper">
            <input type="number" id="discount" value="30" min="0" max="100" oninput="calculate()">
            <div class="unit">%</div>
        </div>
        <input type="range" id="discount-slider" min="0" max="90" value="30" step="5" oninput="syncDiscount(this.value)">
        <div class="quick-percents">
            <span>10</span>
            <span>20</span>
            <span>30</span>
            <span>40</span>
            <span>50</span>
            <span>60</span>
            <span>70+</span>
        </div>
    </div>

    <button class="calculate-btn" onclick="saveToHistory()">🔄 HESAPLA</button>

    <div class="result-box">
        <div class="title">Yeni Fiyat</div>
        <div class="final-price" id="final-price">₺174.93</div>
        <div class="title" style="margin-top: 10px;">Toplam Kazanç (İndirim)</div>
        <div class="savings" id="savings-val">₺74.97 (%30)</div>
    </div>

    <div class="history-section">
        <div class="history-title">Önceki Hesaplamalar</div>
        <div class="history-list" id="history-list">
            <!-- Geçmiş öğeleri buraya dinamik gelecek -->
        </div>
    </div>
</div>

<script>
    function calculate() {
        const price = parseFloat(document.getElementById('price').value) || 0;
        const discount = parseFloat(document.getElementById('discount').value) || 0;

        const discountAmount = (price * discount) / 100;
        const finalPrice = price - discountAmount;

        document.getElementById('final-price').innerText = `₺${finalPrice.toFixed(2)}`;
        document.getElementById('savings-val').innerText = `₺${discountAmount.toFixed(2)} (%${discount})`;

        document.getElementById('price-slider').value = price;
        document.getElementById('discount-slider').value = discount;
    }

    function syncPrice(val) {
        document.getElementById('price').value = parseFloat(val).toFixed(2);
        calculate();
    }

    function syncDiscount(val) {
        document.getElementById('discount').value = val;
        calculate();
    }

    function saveToHistory() {
        const price = parseFloat(document.getElementById('price').value) || 0;
        const discount = parseFloat(document.getElementById('discount').value) || 0;
        if (price <= 0) return;

        const historyList = document.getElementById('history-list');
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<span>ÖNCEKİ</span> <span>${price} TL ➔ %${discount}</span>`;
        
        historyList.prepend(item);
    }

    // Ekran açılışında hesapla
    calculate();
</script>
</body>
</html>
